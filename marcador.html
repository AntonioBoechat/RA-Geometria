<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Peça 1 - RA com marcador</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Mesmo esquema do material do Prof. Siqueira: A-Frame + AR.js, marcador impresso.
       A camera aponta para o marcador (Hiro) e a peca aparece em cima dele.
       Versoes fixadas para estabilidade. -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    .aviso { position: fixed; top: 0; left: 0; right: 0; z-index: 9;
      background: rgba(0,48,96,.88); color: #fff; font-family: Arial, sans-serif;
      font-size: 13px; padding: 8px 12px; text-align: center; }
  </style>
</head>
<body style="margin:0; overflow:hidden;">
  <div class="aviso">Aponte a câmera para o marcador Hiro impresso. Peça 1.</div>
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;"
           vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true;">
    <a-assets>
      <a-asset-item id="peca1" src="models/peca1.glb"></a-asset-item>
    </a-assets>

    <a-marker preset="hiro">
      <!-- escala e reposiciona a peca para ficar centrada sobre o marcador -->
      <a-entity
        gltf-model="#peca1"
        scale="0.3 0.3 0.3"
        position="0.52 -0.9 0.21"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
